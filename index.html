    .neon-ring-wrapper::before {

    (() => {

      if (!root) return;
      const forbidden = "#about, #skills, #expertise, #projects, [data-section='about'], [data-section='skills'], [data-section='expertise'], [data-section='projects']";
      const removeLegacySections = () => {
        root.querySelectorAll(":scope > *").forEach(el => {
