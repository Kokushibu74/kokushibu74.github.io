<!doctype html>
<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#080d16">
<title>Kokushibu — Portfolio Chat</title>
<style>
:root{color-scheme:dark;--bg:#080d16;--panel:#101a27;--line:#23384a;--text:#edf7ff;--muted:#8fa7b9;--cyan:#00e5ff}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:radial-gradient(ellipse at 20% 0%,#102b3b 0,transparent 45%),var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{height:58px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 15px;border-bottom:1px solid var(--line);background:#0b1420e8}
.logo{width:34px;height:34px;display:grid;place-items:center;border-radius:12px;color:#03131b;font-weight:900;background:linear-gradient(135deg,#00e5ff,#76a9ff);box-shadow:0 0 24px #00e5ff25}
.brand{font-weight:800;letter-spacing:.2px}.sub{font-size:11px;color:var(--muted)}.online{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:11px;color:#77e6c0;white-space:nowrap}.presence-dot{width:8px;height:8px;display:inline-block;border-radius:50%;background:#77e6c0;box-shadow:0 0 8px #77e6c088;flex:none}.presence-dot.thinking{background:#ff3b4f;box-shadow:0 0 10px #ff3b4f;animation:dotPulse .7s ease-in-out infinite}.presence-dot.typing{background:var(--cyan);box-shadow:0 0 10px #00e5ff;animation:dotPulse .55s ease-in-out infinite}@keyframes dotPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.25;transform:scale(.72)}}@media(prefers-reduced-motion:reduce){.presence-dot.thinking,.presence-dot.typing{animation:none;opacity:1}}
#chat{flex:1;min-height:0;overflow:auto;padding:15px 12px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.welcome{margin:auto;text-align:center;max-width:340px;padding:18px}.welcome .spark{font-size:32px;color:var(--cyan);text-shadow:0 0 24px #00e5ff55}.welcome h2{font-size:21px;margin:7px 0}.welcome p{color:var(--muted);margin:0}
.msg{max-width:min(92%,760px);padding:12px 14px;border-radius:16px;white-space:normal;overflow-wrap:anywhere;line-height:1.7}.user{align-self:flex-end;background:#163448;border:1px solid #22516a;border-bottom-right-radius:5px;white-space:pre-wrap}.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:5px}.bot p{margin:0 0 9px}.bot p:last-child{margin-bottom:0}.bot h3{font-size:15px;line-height:1.4;margin:10px 0 5px;color:#8cefff}.bot ul,.bot ol{padding-left:22px;margin:5px 0 10px}.bot li{margin:3px 0}.bot a{color:#79eaff;text-decoration:underline;text-underline-offset:3px}.bot code{font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;background:#07111b;padding:2px 5px;border-radius:5px}.bot pre{overflow:auto;white-space:pre;background:#07111b;border:1px solid var(--line);padding:10px;border-radius:9px}.bot pre code{padding:0;background:transparent}.bot strong{color:#fff}.error{color:#ffb6b6}
form{padding:10px 11px max(11px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#09111c}
.composer{display:flex;align-items:flex-end;gap:8px;padding:7px;border:1px solid #2c4559;border-radius:17px;background:#0d1825}
textarea{flex:1;min-width:0;max-height:120px;resize:none;border:0;outline:0;background:transparent;color:var(--text);font:inherit;padding:7px 5px}
button{border:0;border-radius:12px;padding:10px 13px;font:inherit;font-weight:750;cursor:pointer}
#send{background:linear-gradient(135deg,#00e5ff,#7aabff);color:#03131b}button:disabled{opacity:.5;cursor:wait}
.note{text-align:center;font-size:10px;color:#71899a;margin-top:6px}
#clear-chat{flex:none;margin-left:4px;padding:6px 8px;border:1px solid #2c4559;border-radius:8px;background:#0d1825;color:#9db4c6;font-size:10px;white-space:nowrap}
#clear-chat:hover{border-color:#00e5ff;color:#dffaff}
@media(max-width:360px){header{gap:7px;padding:0 9px}.sub{display:none}#clear-chat{font-size:9px;padding:6px}}
</style>
</head>
<body>
<header><div class="logo" aria-hidden="true">✦</div><div><div class="brand">Kokushibu</div><div class="sub">Ask about this portfolio</div></div><div class="online"><span class="presence-dot" id="presenceDot" aria-hidden="true"></span><span id="presenceLabel">Online</span></div><button id="clear-chat" type="button" title="Clear saved conversation">Clear chat</button></header>
<main id="chat" aria-live="polite"><div class="welcome" id="welcome"><div class="spark">✦</div><h2>Hey there!</h2><p>Ask me about Shihab’s projects, skills, or ways to get in touch.</p></div></main>
<form id="form"><div class="composer"><textarea id="input" rows="1" maxlength="4000" placeholder="Message Kokushibu…" aria-label="Message" required></textarea><button id="send" type="submit" aria-label="Send message">➤</button></div><div class="note" id="status">Simple portfolio chat · Powered by AI</div></form>
<script>
(function(){
 const API='https://multi-ai-memory-api.mdshihab74.workers.dev';
 const chat=document.getElementById('chat'),form=document.getElementById('form'),input=document.getElementById('input'),send=document.getElementById('send'),status=document.getElementById('status'),presenceDot=document.getElementById('presenceDot'),presenceLabel=document.getElementById('presenceLabel');
 const system='You are Kokushibu, the official portfolio chatbot for Shihabul Islam. Your name is Kokushibu. If asked your name or identity, answer that your name is Kokushibu. Never call yourself Glyph Cluster, Shihab AI, or any other name. Owner: Shihabul Islam, Bangladesh. Website: https://kokushibu74.github.io/ . GitHub: https://github.com/Kokushibu74 . Email: mdshihab74@gmail.com . WhatsApp: https://wa.me/8801620107233 . YouTube: Lo-Fi World https://www.youtube.com/@Lo-Fi_World-x3w . Interests and work: web development, UI/UX, programming, AI assistants and automation. Known projects include MEMO WhatsApp AI Assistant and Termux Tool OS. Answer in the visitor’s language (Bangla, English, or Banglish), be concise, friendly, and well organized. Use short paragraphs, clear headings when useful, bullet points for lists, numbered steps for instructions, **bold** for key details, and Markdown links where helpful. Avoid giant text walls, repetitive intros, excessive emojis, and unnecessary formatting. Keep simple answers simple. Never invent personal details or project capabilities. IMPORTANT: If a visitor asks how to contact/reach/message Shihab, says they want to talk to him, asks to send him a message, or expresses any intention to contact him, do not simply give the WhatsApp link. The website will collect their name, contact detail, and message and forward it to Shihab. Do not claim that you sent a message unless the website confirms it.';
 const HISTORY_KEY='kokushibu-chat-history-v1';
 const VISITOR_KEY='portfolio-chat-id';
 const COOKIE_NAME='kokushibu_visitor_id';
 function cookieId(){try{const entry=document.cookie.split(';').map(v=>v.trim()).find(v=>v.startsWith(COOKIE_NAME+'='));return entry?decodeURIComponent(entry.slice(COOKIE_NAME.length+1)):''}catch(e){return ''}}
 function makeId(){try{if(typeof crypto!=='undefined'&&typeof crypto.randomUUID==='function')return crypto.randomUUID();if(typeof crypto!=='undefined'&&typeof crypto.getRandomValues==='function'){const bytes=new Uint8Array(16);crypto.getRandomValues(bytes);const hex=Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');return hex.slice(0,8)+'-'+hex.slice(8,12)+'-4'+hex.slice(13,16)+'-'+((parseInt(hex.slice(16,18),16)&63)|128).toString(16)+hex.slice(18,20)+'-'+hex.slice(20)}}catch(e){}return Date.now().toString(16)+'-'+Math.random().toString(16).slice(2)+Math.random().toString(16).slice(2)}
 function getClientId(){let id=cookieId();try{if(!id)id=localStorage.getItem(VISITOR_KEY)||'';if(!id)id=makeId();localStorage.setItem(VISITOR_KEY,id)}catch(e){if(!id)id=makeId()}try{document.cookie=COOKIE_NAME+'='+encodeURIComponent(id)+'; Path=/; Max-Age=31536000; SameSite=Lax; Secure'}catch(e){}return id}
 const clientId=getClientId();
 let history=[],busy=false,contactFlow=null;
 try{const saved=JSON.parse(localStorage.getItem(HISTORY_KEY)||'{}');if(Array.isArray(saved.messages))history=saved.messages.filter(m=>m&&['user','assistant'].includes(m.role)&&typeof m.content==='string').slice(-60).map(m=>({role:m.role,content:m.content,context:m.context!==false}));if(saved.contactFlow&&['name','contact','message'].includes(saved.contactFlow.step))contactFlow=saved.contactFlow}catch(e){}
 function saveHistory(){try{let payload=JSON.stringify({version:1,messages:history.slice(-60),contactFlow});while(payload.length>85000&&history.length>2){history.shift();payload=JSON.stringify({version:1,messages:history,contactFlow})}localStorage.setItem(HISTORY_KEY,payload)}catch(e){}}
 let messages=[{role:'system',content:system},...history.filter(m=>m.context!==false).slice(-14).map(m=>({role:m.role,content:m.content}))];
 function renderBotText(el,text){
  const lines=String(text).replace(/\r/g,'').split('\n');let list=null,paragraph=[];
  function inline(parent,s){
   const re=/\*\*(.+?)\*\*|\*(.+?)\*|\x60([^\x60]+)\x60|\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)|(https?:\/\/[^\s<]+)/g;let last=0,m;
   while((m=re.exec(s))){parent.appendChild(document.createTextNode(s.slice(last,m.index)));
    if(m[1]!==undefined){const n=document.createElement('strong');n.textContent=m[1];parent.appendChild(n)}
    else if(m[2]!==undefined){const n=document.createElement('em');n.textContent=m[2];parent.appendChild(n)}
    else if(m[3]!==undefined){const n=document.createElement('code');n.textContent=m[3];parent.appendChild(n)}
    else {const a=document.createElement('a');a.href=m[5]||m[6];a.textContent=m[4]||m[6];a.target='_blank';a.rel='noopener noreferrer';parent.appendChild(a)}
    last=re.lastIndex;
   }parent.appendChild(document.createTextNode(s.slice(last)));
  }
  function flush(){if(paragraph.length){const p=document.createElement('p');inline(p,paragraph.join(' '));el.appendChild(p);paragraph=[]}}
  function closeList(){if(list){el.appendChild(list);list=null}}
  for(const raw of lines){const line=raw.trim();
   if(!line){flush();closeList();continue}
   const h=line.match(/^#{1,3}\s+(.+)$/);if(h){flush();closeList();const n=document.createElement('h3');inline(n,h[1]);el.appendChild(n);continue}
   const li=line.match(/^[-*•]\s+(.+)$/)||line.match(/^\d+[.)]\s+(.+)$/);
   if(li){flush();const ordered=/^\d/.test(line);if(!list||list.tagName===(ordered?'UL':'OL')){closeList();list=document.createElement(ordered?'OL':'UL')}const item=document.createElement('li');inline(item,li[1]);list.appendChild(item);continue}
   closeList();paragraph.push(line);
  }flush();closeList();
 }
 function remember(role,text,context=true){history.push({role,content:String(text),context:context!==false});if(history.length>60)history=history.slice(-60);saveHistory()}
 function add(role,text,isError,persist=true,context=true){document.getElementById('welcome')?.remove();const el=document.createElement('div');el.className='msg '+(role==='user'?'user':'bot')+(isError?' error':'');if(role==='user')el.textContent=text;else renderBotText(el,text);chat.appendChild(el);chat.scrollTop=chat.scrollHeight;if(persist)remember(role,text,context);return el}
 function restoreHistory(){if(history.length){document.getElementById('welcome')?.remove();history.forEach(m=>add(m.role,m.content,false,false,m.context))}}
 function showWelcome(){chat.innerHTML='<div class="welcome" id="welcome"><div class="spark">✦</div><h2>Hey there!</h2><p>Ask me about Shihab’s projects, skills, or ways to get in touch.</p></div>'}
 function setPresence(mode){presenceDot.classList.remove('thinking','typing');if(mode==='thinking'){presenceDot.classList.add('thinking');presenceLabel.textContent='Thinking';status.textContent='Thinking…'}else if(mode==='typing'){presenceDot.classList.add('typing');presenceLabel.textContent='Replying';status.textContent='Typing a reply…'}else{presenceLabel.textContent='Online';status.textContent='Simple portfolio chat · Powered by AI'}}
 function setBusy(v){busy=v;send.disabled=v;input.disabled=v;if(v)setPresence('thinking');else setPresence('idle')}
 const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
 async function typeReply(el,text){setPresence('typing');el.textContent='';const chunks=String(text).match(/\S+\s*/g)||[String(text)];for(const chunk of chunks){el.appendChild(document.createTextNode(chunk));chat.scrollTop=chat.scrollHeight;const punctuation=/[.!?…][”’"')\]]*$/.test(chunk.trim());await sleep(punctuation?105:27)}renderBotText(el,text);chat.scrollTop=chat.scrollHeight}
 async function sendContactToTelegram(contact){
  const emailMatch=contact.contact.match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i);
  const payload={
   name:contact.name,
   email:emailMatch?emailMatch[0]:'chatbot@kokushibu74.github.io',
   topic:'Message for Shihabul Islam via portfolio chatbot',
   message:'Visitor message via portfolio chatbot\\nVisitor contact: '+contact.contact+'\\n\\nMessage for Shihab:\\n'+contact.message,
   company:''
  };
  const response=await fetch('https://portfolio-contact-telegram.mdshihab74.workers.dev/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const result=await response.json().catch(()=>({}));
  if(!response.ok||!result.ok)throw new Error(result.error||'Telegram delivery failed');
 }
 async function submit(){
  const text=input.value.trim();if(!text||busy)return;
  const wasContactFlow=!!contactFlow;add('user',text,false,true,!wasContactFlow);input.value='';input.style.height='auto';
  if(contactFlow){
   if(contactFlow.step==='name'){contactFlow.name=text;contactFlow.step='contact';add('assistant','Thanks! Please share an email address or phone/WhatsApp number so Shihab can reply.',false,true,false);saveHistory()}
   else if(contactFlow.step==='contact'){contactFlow.contact=text;contactFlow.step='message';add('assistant','Got it. Now type the message you want me to send to Shihab.',false,true,false);saveHistory()}
   else{
    const details={...contactFlow,message:text};contactFlow=null;saveHistory();setBusy(true);const waiting=add('assistant','Sending your message to Shihab…',false,false,false);
    try{await sendContactToTelegram(details);waiting.textContent='Your message has been sent to Shihab. Thanks!';remember('assistant',waiting.textContent,false);status.textContent='Contact message delivered to Telegram.';}
    catch(error){waiting.textContent='Sorry, I could not deliver your message right now. Please email mdshihab74@gmail.com directly.';waiting.classList.add('error');remember('assistant',waiting.textContent,false);status.textContent='Telegram delivery failed.';}
    finally{setBusy(false);input.focus();chat.scrollTop=chat.scrollHeight;}
   }
   chat.scrollTop=chat.scrollHeight;return;
  }
  const contactIntent=/(\b(contact|contacting|reach|message|msg|talk|speak|get in touch)\b.{0,70}\b(shihab|him|owner|you|your|with)\b|\b(shihab|him|owner)\b.{0,70}\b(contact|message|msg|talk|speak|reach)\b|how (can|do) i (contact|reach|message|talk to)|i (want|need|would like) to (contact|message|talk to|speak to|reach)|can i (contact|message|talk to|speak to)|যোগাযোগ|কন্টাক্ট|কন্ট্যাক্ট|মেসেজ পাঠাতে|মেসেজ দিতে|মেসেজ করতে|মেসেজ করতে চাই|কথা বলতে চাই|কথা বলব|শিহাবকে মেসেজ|তাকে মেসেজ|শিহাবের সাথে কথা|শিহাবের সঙ্গে কথা)/i.test(text);
  if(contactIntent){contactFlow={step:'name'};add('assistant','Sure! I can forward a message to Shihab on Telegram. First, what is your name?',false,true,false);saveHistory();chat.scrollTop=chat.scrollHeight;return;}
  messages.push({role:'user',content:text});setBusy(true);const waiting=add('assistant','One moment…',false,false,true);
  try{const res=await fetch(API+'/api/chat',{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({messages:messages.slice(-16),provider:'auto',clientId})});let data={};try{data=await res.json()}catch(e){}if(!res.ok||!data.text)throw new Error(data.error||data.message||('Chat request failed ('+res.status+').'));await typeReply(waiting,data.text);remember('assistant',data.text,true);messages.push({role:'assistant',content:data.text});if(messages.length>21)messages=[messages[0],...messages.slice(-20)];}
  catch(e){waiting.textContent='Sorry, I could not get a reply right now. Please try again shortly.';waiting.classList.add('error');remember('assistant',waiting.textContent,true);status.textContent=String(e.message||e).slice(0,120)}
  finally{setBusy(false);input.focus();chat.scrollTop=chat.scrollHeight}
 }
 const clearChat=document.getElementById('clear-chat');
 clearChat.addEventListener('click',()=>{if(busy)return;history=[];contactFlow=null;messages=[{role:'system',content:system}];try{localStorage.removeItem(HISTORY_KEY)}catch(e){}chat.innerHTML='';showWelcome();input.value='';input.style.height='auto';status.textContent='Chat history cleared on this browser.';input.focus()});
 restoreHistory();
 form.addEventListener('submit',e=>{e.preventDefault();submit()});input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,120)+'px'});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
})();
</script>
</body>
</html>
