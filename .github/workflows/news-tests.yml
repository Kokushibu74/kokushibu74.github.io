name: News feed logic tests

on:
  pull_request:
    paths:
      - "scripts/update_news.py"
      - "scripts/news_telegram_report.py"
      - "tests/test_news_telegram_report.py"
      - ".github/workflows/report-workflow-to-telegram.yml"
      - "tests/test_update_news.py"
      - "news.js"
      - "homepage-news.js"
      - "tests/news-client-optimization.test.mjs"
      - ".github/workflows/news-tests.yml"
  push:
    branches:
      - "main"
      - "feat/news-bangladesh-daily-archive-90d"
    paths:
      - "scripts/update_news.py"
      - "scripts/news_telegram_report.py"
      - "tests/test_update_news.py"
      - "tests/test_news_telegram_report.py"
      - ".github/workflows/news-tests.yml"
      - ".github/workflows/report-workflow-to-telegram.yml"

permissions:
  contents: read

jobs:
  test-news-logic:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Run offline news logic tests
        run: python3 tests/test_update_news.py -v
      - name: Run Telegram report formatter tests
        run: python3 tests/test_news_telegram_report.py -v
      - name: Check browser JavaScript syntax and feed refresh contracts
        run: |
          node --check news.js
          node --check homepage-news.js
          node tests/news-client-optimization.test.mjs
