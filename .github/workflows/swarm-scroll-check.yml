name: Swarm scroll and completion checks

on:
  push:
    branches:
      - fix/swarm-scroll-auto-close

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check swarm-rebuild.js
      - name: Check scroll and auto-close wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path("swarm-rebuild.js").read_text()
          checks = {
              "wheel forwarding": 'on(this.view.host, "wheel"' in s,
              "touch start": 'on(this.view.host, "touchstart"' in s,
              "touch move": 'on(this.view.host, "touchmove"' in s,
              "root scroll forwarding": 'window.scrollBy({ top: e.deltaY' in s,
              "inner scroller forwarding": 'this.env.scroller.scrollBy({ top: e.deltaY' in s,
              "auto close": '}, 2200);' in s,
              "timer cleanup": 'clearTimeout(this.completeTimer);' in s,
              "live reveal": 'if (!this.dead && this.complete) stop(true);' in s,
          }
          for label, ok in checks.items():
              print(("PASS" if ok else "FAIL"), label)
          assert all(checks.values())
          PY
