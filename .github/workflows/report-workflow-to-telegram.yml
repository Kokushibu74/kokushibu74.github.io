name: Report workflow status to Telegram

on:
  workflow_run:
    workflows:
      - Refresh live news feed
      - Live Match Center checks
      - Sports Zone API smoke test
      - pages build and deployment
    types: [completed]

permissions:
  actions: read

concurrency:
  group: telegram-workflow-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  notify:
    if: ${{ github.event.workflow_run.conclusion != 'success' || github.event.workflow_run.name == 'Refresh live news feed' }}
    runs-on: ubuntu-latest
    steps:
      - name: Build sanitized workflow report
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT_NAME: ${{ github.event.workflow_run.event }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          CREATED_AT: ${{ github.event.workflow_run.created_at }}
          UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io, json, os, re, urllib.request, zipfile
          from datetime import datetime
          from zoneinfo import ZoneInfo

          repo = os.environ["REPOSITORY"]
          run_id = os.environ["RUN_ID"]
          token = os.environ["GH_TOKEN"]
          base = f"https://api.github.com/repos/{repo}/actions/runs/{run_id}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=25) as response:
                  return response.read()

          jobs_data = json.loads(get(base + "/jobs?per_page=100"))
          failed = []
          for job in jobs_data.get("jobs", []):
              if job.get("conclusion") in ("failure", "cancelled", "timed_out", "action_required"):
                  bad_steps = [s for s in job.get("steps", []) if s.get("conclusion") in ("failure", "cancelled", "timed_out")]
                  failed.append({
                      "job": job.get("name") or "Unknown job",
                      "step": bad_steps[-1].get("name") if bad_steps else None,
                      "conclusion": job.get("conclusion"),
                  })

          def scrub(value):
              value = str(value or "")
              value = re.sub(r"(?i)(authorization|token|secret|password|api[_-]?key)(\s*[:=]\s*)([^\s,;]+)", r"\1\2[REDACTED]", value)
              value = re.sub(r"(?i)https?://[^\s]+", lambda m: re.sub(r"[?#].*$", "", m.group(0)), value)
              value = re.sub(r"gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}", "[REDACTED TOKEN]", value)
              value = re.sub(r"\b[0-9]{6,}:[A-Za-z0-9_-]{25,}\b", "[REDACTED BOT TOKEN]", value)
              value = re.sub(r"[\x00-\x08\x0b\x0c\x0e-\x1f]", " ", value)
              return value[:260]

          excerpts = []
          news_metrics = {"headlines": None, "bangladesh": None, "rss": None, "publisher_urls": None, "metadata_articles": None}
          news_errors = []
          archive = None
          if os.environ["CONCLUSION"] != "success" or os.environ["WORKFLOW_NAME"] == "Refresh live news feed":
              try:
                  archive = get(base + "/logs")
                  with zipfile.ZipFile(io.BytesIO(archive)) as zf:
                      for name in zf.namelist():
                          if not name.lower().endswith(".txt"):
                              continue
                          for line in zf.read(name).decode("utf-8", "replace").splitlines():
                              if os.environ["CONCLUSION"] != "success" and re.search(r"(?i)error:|##\[error\]|traceback|exception:|fatal:|permission denied|failed to push|process completed with exit code|http error", line):
                                  if re.search(r"(?i)environment variables|request body|response body|payload", line):
                                      continue
                                  clean = scrub(line.strip())
                                  if clean and clean not in excerpts:
                                      excerpts.append(clean)
                              if os.environ["WORKFLOW_NAME"] == "Refresh live news feed" and os.environ["CONCLUSION"] == "success":
                                  headline_match = re.search(r"Wrote\s+(\d+)\s+headlines;\s*Bangladesh:\s*(\d+)\s+from\s+(\d+)\s+successful RSS queries", line)
                                  if headline_match:
                                      news_metrics["headlines"] = int(headline_match.group(1))
                                      news_metrics["bangladesh"] = int(headline_match.group(2))
                                      news_metrics["rss"] = int(headline_match.group(3))
                                  publisher_match = re.search(r"Publisher URLs resolved:\s*(\d+)\s*;\s*metadata fetched:\s*(\d+)\s+articles", line)
                                  if publisher_match:
                                      news_metrics["publisher_urls"] = int(publisher_match.group(1))
                                      news_metrics["metadata_articles"] = int(publisher_match.group(2))
                                  if any(x in line for x in ("Direct RSS error for", "Feed error for", "Weather/disaster feed error for")):
                                      clean = scrub(line.strip())
                                      if clean and clean not in news_errors:
                                          news_errors.append(clean)
                          if len(excerpts) >= 4 and news_metrics["headlines"] is not None and news_metrics["publisher_urls"] is not None:
                              break
              except Exception:
                  if os.environ["CONCLUSION"] != "success":
                      excerpts = ["Log archive unavailable; see the GitHub run for full diagnostics."]
                  else:
                      news_errors = ["News log summary unavailable; feed generation job completed successfully."]

          conclusion = os.environ["CONCLUSION"]
          status = "SUCCESS" if conclusion == "success" else conclusion.upper()
          created = os.environ.get("UPDATED_AT") or os.environ.get("CREATED_AT")
          try:
              stamp = datetime.fromisoformat(created.replace("Z", "+00:00")).astimezone(ZoneInfo("Asia/Dhaka")).strftime("%Y-%m-%d %H:%M:%S BDT")
          except Exception:
              stamp = datetime.now(ZoneInfo("Asia/Dhaka")).strftime("%Y-%m-%d %H:%M:%S BDT")

          is_news = os.environ["WORKFLOW_NAME"] == "Refresh live news feed"
          lines = [
              ("📰 NEWS UPDATE — " if is_news else "🚨 WORKFLOW ALERT — ") + status,
              f"📦 {repo}",
              f"⚙️ {scrub(os.environ['WORKFLOW_NAME'])}",
              f"🕒 {stamp}",
          ]
          if is_news and news_metrics["headlines"] is not None:
              lines.extend([
                  "",
                  "📊 NEWS FEED",
                  f"• মোট শিরোনাম: {news_metrics['headlines']:,}",
                  f"• বাংলাদেশ: {news_metrics['bangladesh']:,}",
                  f"• সফল RSS query: {news_metrics['rss']}",
              ])
              if news_metrics["publisher_urls"] is not None:
                  lines.extend([
                      "",
                      "🔎 PUBLISHER METADATA",
                      f"• URL পাওয়া গেছে: {news_metrics['publisher_urls']}",
                      f"• Metadata article: {news_metrics['metadata_articles']}",
                      "• নোট: এটি অতিরিক্ত metadata সংগ্রহ; RSS headline সংগ্রহের ফল নয়।",
                  ])
          lines.extend([
              "",
              f"🆔 Run: {run_id} · Attempt {os.environ['RUN_ATTEMPT']}",
              f"🔗 {os.environ['RUN_URL']}",
          ])
          if failed:
              lines.append("Failed job/step:")
              for item in failed[:8]:
                  suffix = f" → {scrub(item['step'])}" if item.get("step") else ""
                  lines.append(f"- {scrub(item['job'])}{suffix} ({item['conclusion']})")
          if excerpts:
              lines.append("Safe log excerpts:")
              lines.extend("- " + x for x in excerpts[:4])
          if news_errors:
              lines.extend(["", "⚠️ FEED WARNINGS"])
              lines.extend("- " + x for x in news_errors[:3])
          if conclusion != "success" and not excerpts:
              lines.append("Cause not confirmed from available logs; inspect the linked run.")
          message = "\n".join(lines)[:3900]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("message<<EOF\n" + message + "\nEOF\n")
          PY

      - name: Send Telegram report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MESSAGE: ${{ steps.report.outputs.message }}
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        run: |
          set -euo pipefail
          curl -fsS --retry 2 --retry-all-errors --max-time 25 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            --data-urlencode "disable_web_page_preview=true" >/dev/null

      - name: Report missing Telegram configuration without leaking secrets
        if: ${{ env.TELEGRAM_BOT_TOKEN == '' || env.TELEGRAM_CHAT_ID == '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "::error::Telegram report skipped because one or more required repository secrets are not configured."
          exit 1
