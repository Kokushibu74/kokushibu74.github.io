name: Report workflow status to Telegram

on:
  workflow_run:
    workflows:
      - Refresh live news feed
      - pages build and deployment
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: telegram-workflow-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  notify:
    if: ${{ github.event.workflow_run.conclusion != 'success' || github.event.workflow_run.name == 'Refresh live news feed' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted default-branch report code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Read Telegram automation settings
        id: bot_config
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --max-time 15 https://portfolio-contact-telegram.mdshihab74.workers.dev/workflow-config -o /tmp/bot-config.json
          enabled="$(node -e "const c=require('/tmp/bot-config.json'); process.stdout.write(c.workflowAlerts===true?'true':'false')")"
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

      - name: Test detailed Telegram report formatter
        if: ${{ steps.bot_config.outputs.enabled == 'true' }}
        run: python3 tests/test_news_telegram_report.py -v

      - name: Send detailed Telegram workflow report
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' && steps.bot_config.outputs.enabled == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT_NAME: ${{ github.event.workflow_run.event }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          CREATED_AT: ${{ github.event.workflow_run.created_at }}
          UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
          REPOSITORY: ${{ github.repository }}
        run: python3 scripts/news_telegram_report.py

      - name: Report missing Telegram configuration without leaking secrets
        if: ${{ env.TELEGRAM_BOT_TOKEN == '' || env.TELEGRAM_CHAT_ID == '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "::error::Telegram report skipped because one or more required repository secrets are not configured."
          exit 1
