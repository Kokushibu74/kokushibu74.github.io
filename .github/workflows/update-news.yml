name: Refresh live news feed

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-news.yml"
      - "scripts/update_news.py"
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: news-feed-refresh
  cancel-in-progress: false

jobs:
  refresh-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run offline news logic tests
        run: python3 -m unittest discover -s tests -v
      - name: Generate feed from public RSS sources
        run: python3 scripts/update_news.py
      - name: Commit feed when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news-feed.json
          if git diff --cached --quiet; then
            echo "News feed unchanged."
          else
            git commit -m "chore: refresh live news feed"
            git push
          fi
