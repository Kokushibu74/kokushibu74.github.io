name: Refresh live news feed

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/update-news.yml"
      - "scripts/update_news.py"
      - "news-categories.json"
      - "tests/test_update_news.py"
      - "tests/test_slider_rules.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-news.yml"
      - "scripts/update_news.py"
      - "news-categories.json"
      - "tests/test_update_news.py"
      - "tests/test_slider_rules.py"
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: public-news-feed-refresh
  cancel-in-progress: false

jobs:
  refresh-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out latest main before refreshing the feed
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || 'main' }}
      - name: Run offline news logic tests
        run: python3 tests/test_update_news.py -v
      - name: Run Bangladesh slider boundary tests
        run: python3 tests/test_slider_rules.py -v
      - name: Generate feed from public RSS sources
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          archive_count=$(python3 -c 'import json, pathlib; p=pathlib.Path("news-archive/index.json"); print(json.loads(p.read_text()).get("itemsCount", 0) if p.exists() else 0)')
          if [ "$archive_count" -lt 30000 ]; then
            git fetch --no-tags --depth=1 origin 65c5464e2f24da3a3d3acc11f2d30a24a868a5cb
            git show FETCH_HEAD:news-archive.json > news-archive.json
            echo "Restored the full pre-split archive snapshot for one-time migration."
          fi
          python3 scripts/update_news.py
          rm -f news-archive.json
          rm -rf scripts/__pycache__
      - name: Commit public feed when changed
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A news-feed.json news-archive/
          if git diff --cached --quiet; then
            echo "Public news feed unchanged."
          else
            git commit -m "chore: refresh public news feed"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                echo "Public news feed commit pushed successfully (attempt $attempt)."
                exit 0
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "ERROR: push rejected after 3 safe attempts."
                exit 1
              fi
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "ERROR: rebase conflict while retrying public feed push."
                exit 1
              fi
              sleep 2
            done
          fi
