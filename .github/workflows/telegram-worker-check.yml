name: Telegram Worker and Mini App validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'cloudflare/portfolio-contact-telegram.js'
      - 'cloudflare/multi-ai-memory-api.js'
      - '.github/workflows/telegram-worker-check.yml'
      - 'miniapp/**'
      - 'tests/miniapp-auth.test.mjs'
      - 'tests/resource-budget-guardrails.test.mjs'
      - 'tests/multi-ai-worker-contract.test.mjs'
  push:
    branches: [main, feature/kokushibu-telegram-miniapp]
    paths:
      - 'cloudflare/portfolio-contact-telegram.js'
      - 'cloudflare/multi-ai-memory-api.js'
      - '.github/workflows/telegram-worker-check.yml'
      - 'miniapp/**'
      - 'tests/miniapp-auth.test.mjs'
      - 'tests/resource-budget-guardrails.test.mjs'
      - 'tests/multi-ai-worker-contract.test.mjs'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse Worker module
        run: node --check cloudflare/portfolio-contact-telegram.js
      - name: Verify Telegram Mini App authentication and frontend contracts
        run: node tests/miniapp-auth.test.mjs
      - name: Verify Free-plan resource budget guardrails
        run: node tests/resource-budget-guardrails.test.mjs
      - name: Validate Multi-AI Worker syntax
        run: node --check cloudflare/multi-ai-memory-api.js
      - name: Verify Multi-AI D1 and cache safeguards
        run: node tests/multi-ai-worker-contract.test.mjs
      - name: Verify existing Bot entry points and safety contracts
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('cloudflare/portfolio-contact-telegram.js', 'utf8');
          const required = [
            'callback_query', 'botHandleCallback', 'botMainKeyboard',
            'BOT_CONFIG_KV', 'BOT_DEFAULTS', 'answerCallbackQuery',
            'ADMIN_TELEGRAM_IDS', 'if(action==="refresh")',
            'if(daily&&cfg.dailyReport&&runChecks)', 'cfg.emergencyProtection',
            'pathname==="/workflow-config"', 'newsRefresh:true',
            'const runChecks=!!cfg.monitoring&&!!cfg.scheduledChecks;',
            'async function botStatusText', 'action.startsWith("status:")',
            'bot:user-input:', 'pending?.mode', 'slowCommands',
            'botRunWithProgress(env,msg.chat.id', 'parse_mode:options.parse_mode',
            'BOT_MENU_KEY_PREFIX', 'editMessageText', 'botGetMenuAnchor',
            'sendChatAction', 'botRunWithProgress', 'function botFormatTelegramResponse',
            'ADMIN CONTROL CENTER', 'PRIVATE ADMIN SESSION', 'botFormatTelegramResponse(text,options)',
            'setChatMenuButton', 'function miniAppAuthorize', 'function miniAppDispatchNews',
            'function miniAppHeroPrepare', 'function miniAppUserAction',
            'async function miniAppCronAlert', 'async function miniAppCronHistory',
            'expirationTtl:7776000', 'status:"failed",cron:controller.cron'
          ];
          for (const item of required) {
            if (!source.includes(item)) throw new Error('Missing Telegram/Mini App contract: ' + item);
          }
          if (!source.includes('if(msg.chat.type!=="private")')) throw new Error('Private-chat restriction missing');
          if (!source.includes('!admins.has(sender)')) throw new Error('Admin allowlist check missing');
          if (!source.includes('if(cmd==="/start"||cmd==="/menu")')) throw new Error('Menu entry commands missing');
          if (!source.includes('split(/[\\s,;]+/)')) throw new Error('Admin ID whitespace parsing missing');
          if (source.includes('full backend action পরবর্তী')) throw new Error('Placeholder button action remains');
          console.log('Existing Bot commands, private admin restrictions, safety contracts and Mini App integration verified.');
          NODE
  deployed-smoke-test:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify production Telegram Worker configuration endpoint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 20 \
            https://portfolio-contact-telegram.mdshihab74.workers.dev/workflow-config \
            -o /tmp/worker-config.json
          node - <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('/tmp/worker-config.json', 'utf8'));
          for (const key of ['monitoring', 'dailyReport', 'scheduledChecks', 'trafficAlerts', 'workflowAlerts']) {
            if (typeof config[key] !== 'boolean') throw new Error('Missing boolean config field: ' + key);
          }
          console.log('Production Telegram Worker config endpoint: OK');
          NODE
      - name: Verify production Multi-AI Worker health endpoint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 20 \
            https://multi-ai-memory-api.mdshihab74.workers.dev/health \
            -o /tmp/multi-ai-health.json
          node - <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync('/tmp/multi-ai-health.json', 'utf8'));
          if (health.ok !== true || health.memoryConfigured !== true ||
              health.memoryLimitPerClient !== 100 || health.searchCacheSeconds !== 300 ||
              health.knowledgeCacheSeconds !== 3600) {
            throw new Error('Multi-AI production health contract mismatch');
          }
          console.log('Production Multi-AI Worker health endpoint: OK');
          NODE
