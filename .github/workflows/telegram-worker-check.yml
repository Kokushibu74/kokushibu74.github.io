name: Telegram Worker and Mini App validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'cloudflare/portfolio-contact-telegram.js'
      - '.github/workflows/telegram-worker-check.yml'
      - 'miniapp/**'
      - 'tests/miniapp-auth.test.mjs'
  push:
    branches: [feature/kokushibu-telegram-miniapp]
    paths:
      - 'cloudflare/portfolio-contact-telegram.js'
      - '.github/workflows/telegram-worker-check.yml'
      - 'miniapp/**'
      - 'tests/miniapp-auth.test.mjs'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse Worker module
        run: node --check cloudflare/portfolio-contact-telegram.js
      - name: Verify Telegram Mini App authentication and frontend contracts
        run: node tests/miniapp-auth.test.mjs
      - name: Verify existing Bot entry points remain present
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('cloudflare/portfolio-contact-telegram.js', 'utf8');
          for (const item of ['ADMIN_TELEGRAM_IDS', 'BOT_CONFIG_KV', 'TELEGRAM_WEBHOOK_SECRET', 'telegram-webhook', 'workflow-config', 'callback_query']) {
            if (!source.includes(item)) throw new Error('Existing Bot/Worker contract missing: ' + item);
          }
          console.log('Existing Telegram webhook, admin allowlist, KV config and workflow-config routes remain in source.');
          NODE
