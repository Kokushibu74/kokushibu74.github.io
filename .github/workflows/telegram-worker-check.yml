name: Telegram Worker and Mini App validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'cloudflare/portfolio-contact-telegram.js'
      - 'cloudflare/blog-manager.mjs'
      - 'journal.js'
      - 'journal.css'
      - 'projects.html'
      - 'tests/blog-manager.test.mjs'
      - 'tests/developer-journal.test.mjs'
      - 'tests/journal-browser-smoke.cjs'
      - 'tests/visitor-location.test.mjs'
      - 'tests/visitor-location-runtime.test.mjs'
      - 'cloudflare/multi-ai-memory-api.js'
      - '.github/workflows/telegram-worker-check.yml'
      - 'miniapp/**'
      - 'tests/miniapp-auth.test.mjs'
      - 'tests/resource-budget-guardrails.test.mjs'
      - 'tests/telegram-daily-report.test.mjs'
      - 'tests/telegram-bot-regression.test.mjs'
      - 'tests/kv-alert-optimization.test.mjs'
      - 'tests/multi-ai-worker-contract.test.mjs'
  push:
    branches: [main, feature/kokushibu-telegram-miniapp, test/visitor-location-runtime-20261105]
    paths:
      - 'tests/visitor-location.test.mjs'
      - 'tests/visitor-location-runtime.test.mjs'
      - 'cloudflare/portfolio-contact-telegram.js'
      - 'cloudflare/blog-manager.mjs'
      - 'journal.js'
      - 'journal.css'
      - 'projects.html'
      - 'tests/blog-manager.test.mjs'
      - 'tests/developer-journal.test.mjs'
      - 'tests/journal-browser-smoke.cjs'
      - 'cloudflare/multi-ai-memory-api.js'
      - '.github/workflows/telegram-worker-check.yml'
      - 'miniapp/**'
      - 'tests/miniapp-auth.test.mjs'
      - 'tests/resource-budget-guardrails.test.mjs'
      - 'tests/telegram-daily-report.test.mjs'
      - 'tests/telegram-bot-regression.test.mjs'
      - 'tests/kv-alert-optimization.test.mjs'
      - 'tests/multi-ai-worker-contract.test.mjs'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse Worker module
        run: node --check cloudflare/portfolio-contact-telegram.js
      - name: Parse Developer Journal modules and frontend scripts
        run: |
          node --check cloudflare/blog-manager.mjs
          node --check journal.js
          node --check miniapp/app.js
      - name: Verify Developer Journal publishing and visibility rules
        run: node tests/blog-manager.test.mjs
      - name: Verify Developer Journal UI and Project Slider boundary
        run: node tests/developer-journal.test.mjs
      - name: Verify Telegram menu and KV write regressions
        run: node tests/telegram-bot-regression.test.mjs
      - name: Verify KV optimization and alert security contracts
        run: node tests/kv-alert-optimization.test.mjs
      - name: Verify visitor location consent and Telegram directory contracts
        run: node tests/visitor-location.test.mjs
      - name: Run Worker location endpoint runtime tests
        run: node --test tests/visitor-location-runtime.test.mjs
      - name: Verify Telegram Mini App authentication and frontend contracts
        run: node tests/miniapp-auth.test.mjs
      - name: Verify Cloudflare Standard resource budget guardrails
        run: node tests/resource-budget-guardrails.test.mjs
      - name: Verify five-part Telegram daily report
        run: node tests/telegram-daily-report.test.mjs
      - name: Validate Multi-AI Worker syntax
        run: node --check cloudflare/multi-ai-memory-api.js
      - name: Verify Multi-AI D1 and cache safeguards
        run: node tests/multi-ai-worker-contract.test.mjs
      - name: Verify existing Bot entry points and safety contracts
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('cloudflare/portfolio-contact-telegram.js', 'utf8');
          const required = [
            'callback_query', 'botHandleCallback', 'botMainKeyboard',
            'BOT_CONFIG_KV', 'BOT_DEFAULTS', 'answerCallbackQuery',
            'ADMIN_TELEGRAM_IDS', 'if(action==="refresh")',
            'if(shouldSendDailyReport)', 'cfg.emergencyProtection',
            'pathname==="/workflow-config"', 'newsRefresh:true',
            'const runChecks=!!cfg.monitoring&&!!cfg.scheduledChecks;',
            'async function botStatusText', 'action.startsWith("status:")',
            'bot:user-input:', 'pending?.mode', 'slowCommands',
            'botRunWithProgress(env,msg.chat.id', 'parse_mode:options.parse_mode',
            'BOT_MENU_KEY_PREFIX', 'editMessageText', 'botGetMenuAnchor',
            'sendChatAction', 'botRunWithProgress', 'function botFormatTelegramResponse',
            'ADMIN CONTROL CENTER', 'PRIVATE ADMIN SESSION', 'botFormatTelegramResponse(text,options)',
            'setChatMenuButton', 'function miniAppAuthorize', 'function miniAppDispatchNews',
            'function miniAppHeroPrepare', 'function miniAppUserAction',
            'async function miniAppCronAlert', 'async function miniAppCronHistory',
            'expirationTtl:7776000', 'status:"failed",cron:controller.cron'
          ];
          for (const item of required) {
            if (!source.includes(item)) throw new Error('Missing Telegram/Mini App contract: ' + item);
          }
          if (!source.includes('if(msg.chat.type!=="private")')) throw new Error('Private-chat restriction missing');
          if (!source.includes('!admins.has(sender)')) throw new Error('Admin allowlist check missing');
          if (!source.includes('if(cmd==="/start"||cmd==="/menu")')) throw new Error('Menu entry commands missing');
          if (!source.includes('split(/[\\s,;]+/)')) throw new Error('Admin ID whitespace parsing missing');
          if (source.includes('full backend action পরবর্তী')) throw new Error('Placeholder button action remains');
          console.log('Existing Bot commands, private admin restrictions, safety contracts and Mini App integration verified.');
          NODE
  deployed-smoke-test:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify production Telegram Worker configuration endpoint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 20 \
            https://portfolio-contact-telegram.mdshihab74.workers.dev/workflow-config \
            -o /tmp/worker-config.json
          node - <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('/tmp/worker-config.json', 'utf8'));
          for (const key of ['monitoring', 'dailyReport', 'scheduledChecks', 'newsRefresh', 'newsAlerts', 'trafficAlerts', 'workflowAlerts']) {
            if (typeof config[key] !== 'boolean') throw new Error('Missing boolean config field: ' + key);
          }
          console.log('Production Telegram Worker config endpoint: OK');
          NODE
      - name: Verify production coarse location context endpoint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 20 \
            https://portfolio-contact-telegram.mdshihab74.workers.dev/location-context \
            -o /tmp/location-context.json
          node - <<'NODE'
          const fs = require('node:fs');
          const context = JSON.parse(fs.readFileSync('/tmp/location-context.json', 'utf8'));
          if (context.ok !== true || !['city', 'region', 'country', 'timezone'].every(key => typeof context[key] === 'string')) {
            throw new Error('Production location context response contract mismatch');
          }
          console.log('Production coarse location context endpoint: OK');
          NODE
      - name: Verify production Multi-AI Worker health endpoint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 20 \
            https://multi-ai-memory-api.mdshihab74.workers.dev/health \
            -o /tmp/multi-ai-health.json
          node - <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync('/tmp/multi-ai-health.json', 'utf8'));
          if (health.ok !== true || health.memoryConfigured !== true ||
              health.memoryLimitPerClient !== 100 || health.searchCacheSeconds !== 300 ||
              health.knowledgeCacheSeconds !== 3600) {
            throw new Error('Multi-AI production health contract mismatch');
          }
          console.log('Production Multi-AI Worker health endpoint: OK');
          NODE
      - name: Verify production D1 memory read, write, and cleanup
        env:
          WORKER_URL: https://multi-ai-memory-api.mdshihab74.workers.dev
        run: |
          node <<'NODE'
          const base = process.env.WORKER_URL;
          const clientId = crypto.randomUUID();
          const text = 'GitHub Actions D1 smoke test ' + crypto.randomUUID();
          let memoryId = null;
          async function listMemory() {
            const response = await fetch(base + '/api/memory?clientId=' + encodeURIComponent(clientId));
            if (!response.ok) throw new Error('D1 memory read failed: HTTP ' + response.status);
            const data = await response.json();
            if (!Array.isArray(data.items)) throw new Error('D1 memory response did not include an items array');
            return data.items;
          }
          try {
            const before = await listMemory();
            if (before.length !== 0) throw new Error('Random smoke-test client ID was not empty');
            const saved = await fetch(base + '/api/memory', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ clientId, text })
            });
            if (!saved.ok) throw new Error('D1 memory write failed: HTTP ' + saved.status);
            const after = await listMemory();
            const item = after.find(entry => entry.text === text);
            if (!item || !item.id) throw new Error('D1 memory write could not be read back');
            memoryId = item.id;
            console.log('Production D1 memory write/read: OK');
          } finally {
            if (!memoryId) {
              try {
                const pending = await listMemory();
                memoryId = pending.find(entry => entry.text === text)?.id || null;
              } catch {}
            }
            if (memoryId) {
              const removed = await fetch(base + '/api/memory/' + encodeURIComponent(memoryId), {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ clientId })
              });
              if (!removed.ok) throw new Error('D1 smoke-test cleanup failed: HTTP ' + removed.status);
              const remaining = await listMemory();
              if (remaining.some(entry => entry.id === memoryId)) throw new Error('D1 smoke-test record remained after cleanup');
              console.log('Production D1 memory cleanup: OK');
            }
          }
          NODE

  journal-live-smoke-test:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify live Developer Journal public feed and privacy boundary
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 9 --retry-delay 10 --retry-all-errors --max-time 20 \
            -H 'Origin: https://kokushibu74.github.io' \
            -D /tmp/journal-feed-headers \
            'https://portfolio-contact-telegram.mdshihab74.workers.dev/journal-feed' \
            -o /tmp/journal-feed.json
          grep -qi '^access-control-allow-origin: https://kokushibu74.github.io' /tmp/journal-feed-headers
          node - <<'NODE'
          const fs = require('node:fs');
          const feed = JSON.parse(fs.readFileSync('/tmp/journal-feed.json', 'utf8'));
          if (feed.ok !== true || !Array.isArray(feed.posts)) throw new Error('Journal feed response contract mismatch');
          for (const post of feed.posts) {
            if (post.status !== 'published' || post.deletedAt || post.previousStatus) throw new Error('Public feed contains a non-published status or private Journal fields');
            for (const field of ['id', 'title', 'description', 'category', 'content']) {
              if (typeof post[field] !== 'string') throw new Error('Public post missing ' + field);
            }
          }
          console.log('Live Journal feed and public/private boundary: OK (' + feed.posts.length + ' published posts)');
          NODE
      - name: Verify live GitHub Pages Journal section and assets
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 9 --retry-delay 10 --retry-all-errors --max-time 20 \
            'https://kokushibu74.github.io/projects.html' -o /tmp/projects-live.html
          grep -q 'id="developer-journal"' /tmp/projects-live.html
          grep -q 'id="journal-article-view"' /tmp/projects-live.html
          grep -q 'journal.css?v=1' /tmp/projects-live.html
          grep -q 'journal.js?v=1' /tmp/projects-live.html
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --max-time 20 \
            'https://kokushibu74.github.io/journal.css?v=1' -o /tmp/journal-live.css
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --max-time 20 \
            'https://kokushibu74.github.io/journal.js?v=1' -o /tmp/journal-live.js
          grep -q 'journal-card:hover' /tmp/journal-live.css
          grep -q 'portfolio-contact-telegram.mdshihab74.workers.dev/journal-feed' /tmp/journal-live.js
          echo 'Live GitHub Pages Journal markup, CSS and JavaScript: OK'
      - name: Verify Telegram Blog Manager asset is published
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --max-time 20 \
            'https://kokushibu74.github.io/miniapp/app.js' -o /tmp/miniapp-live.js
          grep -q 'Developer Journal' /tmp/miniapp-live.js
          grep -q 'blogSave' /tmp/miniapp-live.js
          echo 'Live Telegram Blog Manager asset: OK'

  journal-browser-smoke:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright@latest
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify live Journal interactions in a browser
        run: node tests/journal-browser-smoke.cjs
